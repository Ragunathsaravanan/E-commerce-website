<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'bootstrap-3.4.1-dist/css/bootstrap.min.css' %}">
</head>
<body id="login_page_body">

    
    <div>
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>

    <div class="container" id="login_page">
        <form action="{% url 'login' %}" method="post" autocomplete="off">
            {% csrf_token %}
            <div class="form-group">
                <label id="login_page_label">Name</label>
                <input type="text" class="form-control" id="login_page_input" name="username" required>
            </div>

            <div class="form-group">
                <label id="login_page_label">Password</label>
                <input type="password" class="form-control" id="login_page_input" name="password" required>
            </div>

            <div class="form-group text-center">
                <input type="submit" class="btn btn-primary" id="login_page_btn" value="Login">
                <input type="reset" class="btn btn-primary" id="login_page_btn" value="Clear">
                
                <a href="{% url 'signin' %}" class="btn btn-success" id="login_page_btn">Sign Up</a>
            </div>
        </form>
    </div>

</body>
</html>
