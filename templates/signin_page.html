<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    {% load static %}
    <link rel="stylesheet" href="{ % static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'bootstrap-3.4.1-dist/css/bootstrap.min.css' %}">
</head>
<body>
    <div>
        {% if messages %}
            <ul class="messages">
                 {% for message in messages %}       <!-- here the for loop is used so  that we can pass the diff like {{message}}  -->
                    <li{% if message.tags %} class="{{ message.tags }}" {% endif %}>  
                        {{ message }}
                    </li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
    <div>
        <form action="/signin/" class="" method="post" autocomplete="off">
            {% csrf_token %}
            <div>
                <label for="">Name</label>
                <input type="text" class="" name="username">
            </div>
            <div>
                <label for="">Password</label>
                <input type="text" class="" name="password">
            </div>
            <div>
                <input type="submit" name="" value="signin" id="">
                <input type="reset" name="" value="clear" id="">
            </div>
        </form>
    </div>
</body>
</html>
